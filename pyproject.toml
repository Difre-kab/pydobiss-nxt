[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydobiss-nxt"
version = "0.1.0"
description = "Async Python client for the DOBISS NXT home automation server (REST + WebSocket API)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Freddy Ukaba Bahati" },
]
keywords = ["dobiss", "nxt", "home-automation", "domotics", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.9",
    "PyJWT>=2.8",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/Difre-kab/pydobiss-nxt"
Documentation = "https://github.com/Difre-kab/pydobiss-nxt#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/pydobiss_nxt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]
mypy_path = "src"
python_version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC", "B"]
